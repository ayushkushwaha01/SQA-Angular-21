<div class="column-selector-dialog">
  <div class="dialog-header d-flex justify-content-between align-items-center">
    <h3 mat-dialog-title class="m-0">Select Columns</h3>
    <button mat-icon-button (click)="close()" class="close-btn">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div mat-dialog-content class="dialog-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="text-muted small">Choose columns to display in the grid</span>
      <div>
        <button mat-button color="primary" class="btn-sm" (click)="selectAll(true)">Select All</button>
        <button mat-button class="btn-sm text-muted" (click)="selectAll(false)">Deselect All</button>
      </div>
    </div>
    <div class="columns-grid">
      <div *ngFor="let col of columns" class="column-item">
        <mat-checkbox [(ngModel)]="col.visible" color="primary">
          {{ col.name }}
        </mat-checkbox>
      </div>
    </div>
  </div>

  <div mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button (click)="close()">Cancel</button>
    <button mat-raised-button color="primary" (click)="save()">Save Layout</button>
  </div>
</div>
