<h2 mat-dialog-title style="background: #2563eb; color: white; margin: -24px -24px 20px -24px; padding: 15px 24px;">
  Setup Authenticator App
</h2>

<mat-dialog-content>
  <div *ngIf="isLoading" class="text-center p-4">
    <mat-spinner diameter="40" style="margin: 0 auto;"></mat-spinner>
    <p class="mt-3 text-muted">Generating secure QR code...</p>
  </div>

  <div *ngIf="!isLoading" class="text-center">
    <p style="color: #6b7280; font-size: 14px; margin-bottom: 20px;">
      1. Open Google Authenticator or Microsoft Authenticator.<br>
      2. Tap the "+" icon and scan the QR code below.
    </p>

    <!-- The QR Code Image -->
    <img [src]="qrCodeUrl" alt="Authenticator QR Code" style="width: 200px; height: 200px; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; margin-bottom: 15px;">

    <p style="font-size: 12px; color: #9ca3af; margin-bottom: 20px;">
      Can't scan the code? Enter this key manually:<br>
      <strong style="color: #374151; letter-spacing: 1px;">{{ manualKey }}</strong>
    </p>

    <mat-divider style="margin-bottom: 20px;"></mat-divider>

    <p style="font-weight: 500; margin-bottom: 10px;">3. Verify Setup</p>
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Enter 6-digit code</mat-label>
      <input matInput [(ngModel)]="verificationCode" maxlength="6" placeholder="000000" (keyup.enter)="verifyCode()">
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="close()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="verificationCode.length < 6" (click)="verifyCode()">
    Verify & Enable
  </button>
</mat-dialog-actions>
