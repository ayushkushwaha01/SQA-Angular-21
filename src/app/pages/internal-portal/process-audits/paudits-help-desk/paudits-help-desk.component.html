<div class="helpdesk-popup-container">
  <!-- Header -->
  <div class="helpdesk-header">
    <h2 class="header-title">Send Mail ({{ data?.module || 'Inspection' }})</h2>
  </div>

  <!-- Body Form -->
  <div class="helpdesk-body">
    <form (ngSubmit)="save()">
      <!-- Subject Field -->
      <div class="form-row">
        <label class="field-label">Subject :<span class="required-star">*</span></label>
        <div class="field-control">
          <input type="text" class="custom-input" placeholder="Enter Subject"
            [(ngModel)]="subject" name="subject" [disabled]="isSending" autocomplete="off">
        </div>
      </div>

      <!-- Description Field -->
      <div class="form-row">
        <label class="field-label field-label-top">Description :<span class="required-star">*</span></label>
        <div class="field-control">
          <textarea class="custom-textarea" rows="7" placeholder="Enter Description"
            [(ngModel)]="description" name="description" [disabled]="isSending"></textarea>
        </div>
      </div>
    </form>
  </div>

  <!-- Actions -->
  <div class="helpdesk-footer">
    <button mat-raised-button type="button" class="btn-custom-close" (click)="close()" [disabled]="isSending">
      <mat-icon class="icon-cancel">cancel</mat-icon>
      <span>Close</span>
    </button>

    <button mat-raised-button type="button" class="btn-custom-send" (click)="save()" [disabled]="isSending">
      <mat-icon class="icon-send">{{ isSending ? 'hourglass_top' : 'send' }}</mat-icon>
      <span>{{ isSending ? 'Sending...' : 'Send' }}</span>
    </button>
  </div>
</div>
