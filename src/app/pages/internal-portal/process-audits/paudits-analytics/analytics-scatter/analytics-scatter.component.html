<!-- Filter Bar wired to Reactive Form -->
<div class="filter-bar" [formGroup]="filterForm">
    <div class="filter-group">
        <label class="filter-label mb-0">Select Month :</label>
        <mat-select placeholder="Select Month" class="form-control" formControlName="month"
            style="width: auto; min-width: 120px;">
            <mat-option value="January">January</mat-option>
            <mat-option value="February">February</mat-option>
            <mat-option value="March">March</mat-option>
            <mat-option value="April">April</mat-option>
            <mat-option value="May">May</mat-option>
            <mat-option value="June">June</mat-option>
            <mat-option value="July">July</mat-option>
            <mat-option value="August">August</mat-option>
            <mat-option value="September">September</mat-option>
            <mat-option value="October">October</mat-option>
            <mat-option value="November">November</mat-option>
            <mat-option value="December">December</mat-option>
        </mat-select>
    </div>

    <div class="filter-group">
        <label class="filter-label mb-0">Select Year :</label>
        <mat-select placeholder="Select Year" class="form-control" formControlName="year"
            style="width: auto; min-width: 120px;">
            <mat-option value="2023">2023</mat-option>
            <mat-option value="2024">2024</mat-option>
            <mat-option value="2025">2025</mat-option>
            <mat-option value="2026">2026</mat-option>
        </mat-select>
    </div>

    <!-- Go button triggers backend reload -->
    <button type="button" class="go-btn" mat-raised-button (click)="loadScatterData()" [disabled]="isLoading">
        <mat-icon class="mat-icon mt-1" *ngIf="!isLoading">search</mat-icon>
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm mr-1" role="status" aria-hidden="true"></span>
        {{ isLoading ? 'Loading...' : 'Go' }}
    </button>

    <button type="button" mat-raised-button class="btn-clear" (click)="clearFilter()" [disabled]="isLoading">
        <mat-icon>settings_backup_restore</mat-icon> Clear
    </button>
</div>

<!-- Highcharts Scatter Plot Container -->
<div class="dashboard-container position-relative">
    <div *ngIf="isLoading" class="chart-loading-overlay">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading scatter plot data...</span>
        </div>
    </div>

    <div *ngIf="hasNoData && !isLoading" class="no-data-notice">
        <mat-icon>info</mat-icon>
        <span>No audit data available for {{ filterForm.value.month }} {{ filterForm.value.year }}.</span>
    </div>

    <div class="chart-wrapper" *ngIf="!hasNoData && !isLoading">
        <highcharts-chart [Highcharts]="Highcharts" [options]="chartOptions" [(update)]="updateFlag" [oneToOne]="true"
            style="width: 100%; height: 500px; display: block;">
        </highcharts-chart>
    </div>
</div>
