<div class="actions-container">
    

  <div class="filter-bar">
    <div class="filter-group right-align-group">
      <label class="filter-label mb-0">Commodity :</label>
      <mat-select placeholder="All Commodities" class="form-control" [(ngModel)]="selectedCommodity" style="width: auto; min-width: 180px;">
        <mat-option [value]="null">All Commodities</mat-option>
        <mat-option *ngFor="let c of commodities" [value]="c.commodityId">{{ c.name }}</mat-option>
      </mat-select>

      <label class="filter-label mb-0">Select Year :</label>
      <mat-select placeholder="Select Year" class="form-control" [(ngModel)]="selectedYear" style="width: auto; min-width: 120px;">
        <mat-option *ngFor="let yr of years" [value]="yr">{{ yr }}</mat-option>
      </mat-select>
    </div>

    <button type="button" class="go-btn" mat-raised-button (click)="loadAnalytics()" [disabled]="isLoading">
      <mat-icon class="mat-icon mt-1" *ngIf="!isLoading">search</mat-icon>
      <span *ngIf="isLoading" class="spinner-border spinner-border-sm mr-1" role="status" aria-hidden="true"></span>
      {{ isLoading ? 'Loading...' : 'Go' }}
    </button>

    <button type="button" mat-raised-button class="btn-clear" (click)="clearFilter()" [disabled]="isLoading">
      <mat-icon>settings_backup_restore</mat-icon> Clear
    </button>
  </div>

  <!-- Monthly Critical Actions Logged -->
  <h2 class="section-title">Monthly Critical CAPA Logged</h2>
  <div class="full-chart-card">
    <highcharts-chart
      [Highcharts]="Highcharts"
      [options]="criticalOptions"
      style="width: 100%; height: 300px; display: block"
    >
    </highcharts-chart>
  </div>

  <!-- Monthly Important Actions Logged -->
  <h2 class="section-title">Monthly Important CAPA Logged</h2>
  <div class="full-chart-card">
    <highcharts-chart
      [Highcharts]="Highcharts"
      [options]="importantOptions"
      style="width: 100%; height: 300px; display: block"
    >
    </highcharts-chart>
  </div>

  <!-- Monthly Critical and Important Actions Logged Versus Resolved -->
  <h2 class="section-title">
    Monthly Critical and Important CAPA Logged Versus Resolved
  </h2>
  <div class="full-chart-card">
    <highcharts-chart
      [Highcharts]="Highcharts"
      [options]="logVsResolvedOptions"
      style="width: 100%; height: 300px; display: block"
    >
    </highcharts-chart>
  </div>

  <!-- Aging Analysis -->
  <h2 class="section-title aging-title">CAPA Agieng Analysis</h2>
  <div class="aging-row">
    <div class="aging-table-card">
      <table>
        <thead>
          <tr>
            <th>Period</th>
            <th >Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of agingList">
            <td>{{ item.period }}</td>
            <td >{{ item.action }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="aging-chart-card">
      <highcharts-chart
        [Highcharts]="Highcharts"
        [options]="agingPieOptions"
        style="width: 100%; height: 350px; display: block"
      >
      </highcharts-chart>
    </div>
  </div>
</div>
