<div class="NewHeader">
    <h3 style="margin: 0; padding: 0px 25px; font-weight: 400; font-size: 18px; text-align: center;">
        {{ isEditMode ? 'Update Process Category' : 'Add Process Category' }}
    </h3>
</div>

<div mat-dialog-content style="padding: 20px 25px 10px 25px; overflow-x: hidden;">
    <!-- Wrap inputs in the form group -->
    <form [formGroup]="categoryForm">
        <div class="row mb-3 align-items-center mx-0">
            <div class="col-sm-4 fw-bold p-0">Category Name: <span class="text-danger">*</span></div>
            <div class="col-sm-8 p-0">
                <input type="text" class="form-control" formControlName="categoryName"
                    placeholder="Enter Category Name" style="background-color: #fefec4 !important;">
            </div>
        </div>
        <div class="row mb-3 align-items-center mx-0">
            <div class="col-sm-4 fw-bold p-0">Category Code: <span class="text-danger">*</span></div>
            <div class="col-sm-8 p-0">
                <input type="text" class="form-control" formControlName="categoryCode"
                    placeholder="Enter Code (e.g. QMS)" style="background-color: #fefec4 !important;">
            </div>
        </div>
    </form>
</div>

<mat-dialog-actions align="end" style="padding: 15px 25px 20px 25px !important; margin: 0; display: flex !important; justify-content: flex-end !important; gap: 0px;">
    <button mat-raised-button class="btn-default" (click)="close()" style="background-color: #e0e0e0; color: #333;">
        <mat-icon>cancel</mat-icon> Close
    </button>
    <button mat-raised-button color="primary" class="save" [disabled]="!categoryForm.valid" (click)="save()">
        <mat-icon>save</mat-icon> {{ isEditMode ? 'Update' : 'Save' }}
    </button>
</mat-dialog-actions>
