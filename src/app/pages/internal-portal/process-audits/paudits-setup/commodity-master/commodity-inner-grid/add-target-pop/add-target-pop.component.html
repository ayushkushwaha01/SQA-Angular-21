<div class="NewHeader">
    <h3 style="margin: 0; padding: 15px 20px; font-weight: 400; font-size: 18px;">
        {{ isEditMode ? 'Update Target' : 'Add Target' }}
    </h3>
</div>

<div mat-dialog-content style="padding: 20px 25px;">
    <form [formGroup]="form">
        
        <div class="row mb-3 align-items-center mx-0">
            <div class="col-sm-4 fw-bold p-0">Year: <span class="text-danger">*</span></div>
            <div class="col-sm-8 p-0">
                <input type="number" class="form-control" formControlName="targetYear" placeholder="YYYY" style="background-color: #fefec4 !important;">
            </div>
        </div>

        <div class="row mb-3 align-items-center mx-0">
            <div class="col-sm-4 fw-bold p-0">Q1 Target: <span class="text-danger">*</span></div>
            <div class="col-sm-8 p-0">
                <input type="number" class="form-control" formControlName="q1" min="0" max="100" placeholder="0-100" style="background-color: #fefec4 !important;">
            </div>
        </div>

        <div class="row mb-3 align-items-center mx-0">
            <div class="col-sm-4 fw-bold p-0">Q2 Target: <span class="text-danger">*</span></div>
            <div class="col-sm-8 p-0">
                <input type="number" class="form-control" formControlName="q2" min="0" max="100" placeholder="0-100" style="background-color: #fefec4 !important;">
            </div>
        </div>

        <div class="row mb-3 align-items-center mx-0">
            <div class="col-sm-4 fw-bold p-0">Q3 Target: <span class="text-danger">*</span></div>
            <div class="col-sm-8 p-0">
                <input type="number" class="form-control" formControlName="q3" min="0" max="100" placeholder="0-100" style="background-color: #fefec4 !important;">
            </div>
        </div>

        <div class="row mb-3 align-items-center mx-0">
            <div class="col-sm-4 fw-bold p-0">Q4 Target: <span class="text-danger">*</span></div>
            <div class="col-sm-8 p-0">
                <input type="number" class="form-control" formControlName="q4" min="0" max="100" placeholder="0-100" style="background-color: #fefec4 !important;">
            </div>
        </div>

    </form>
</div>

<mat-dialog-actions align="end" style="padding: 15px 25px 20px 25px !important; margin: 0 -25px -20px -25px !important; display: flex !important; justify-content: flex-end !important; gap: 12px;">
    <button mat-raised-button class="btn-default" (click)="close()" style="background-color: #e0e0e0; color: #333;">
        <mat-icon>cancel</mat-icon> Close
    </button>
    <button mat-raised-button type="submit" class="save" color="primary" [disabled]="!form.valid" (click)="save()">
        <mat-icon>save</mat-icon> {{ isEditMode ? 'Update' : 'Save' }}
    </button>
</mat-dialog-actions>
