<div class="custom-layout-wrapper">
  <div *ngIf="isMasterRoute()" style="width:100%">

    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 15px;">
      <button mat-raised-button
        style="background-color: #1a1a1a; color: white; padding: 0 16px; height: 40px; border: none; border-radius: 4px; display: flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer;"
        (click)="toggleFilters()">
        <mat-icon class="mt-1" style="font-size: 18px; height: 18px; width: 18px;">filter_list</mat-icon>
        Filter
      </button>

      <button mat-raised-button [class.disable-custom]="!canCreate"
        style="background-color: #2196f3; color: white; padding: 0 16px; height: 40px; border: none; border-radius: 4px; display: flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer;"
        (click)="addCommodity(null)">
        <mat-icon class="mt-1" style="font-size: 18px; height: 18px; width: 18px;">add</mat-icon>
        <span class="button-text">Add Commodity</span>
      </button>
    </div>

    <div class="row" *ngIf="showFilters" style="margin-left: 0px; margin-bottom: 15px; width: 100%;">
      <div class="col-sm-12 w-100 p-0">
        <mat-card class="filter"
          style="box-shadow: none !important; border: 1px solid #e0e0e0; background-color: #f8f9fa; border-radius: 6px;">
          <mat-card-content style="padding: 12px 16px;">
            <div class="row align-items-center">
              <div class="col-md-4 d-flex align-items-center">
                <label style="font-weight: bold; width: 80px; margin-bottom: 0;">Keyword:</label>
                <input type="text" [(ngModel)]="selectedKeyword" class="form-control"
                  placeholder="Search by Name, Code..." style="flex: 1;">
              </div>
              <div class="col-md-4 d-flex align-items-center">
                <label style="font-weight: bold; width: 80px; margin-bottom: 0;">Status:</label>
                <mat-select placeholder="Select Status" class="form-control" [(ngModel)]="selectedStatus"
                  style="flex: 1;">
                  <mat-option value="Active">Active</mat-option>
                  <mat-option value="Inactive">Inactive</mat-option>
                </mat-select>
              </div>
              <div class="col-md-4 d-flex justify-content-end align-items-center gap-2">
                <button mat-raised-button color="primary" (click)="onGo()">
                  <mat-icon>search</mat-icon> Search
                </button>
                <button mat-raised-button class="btn-default" (click)="onClear()"
                  style="background-color: #e0e0e0; color: #333;">
                  <mat-icon>settings_backup_restore</mat-icon> Clear
                </button>
              </div>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    </div>

    <div class="table-responsive bg-white shadow-sm">
      <table class="custom-grid-table">
        <thead>
          <tr>
            <th>Commodity Name</th>
            <th class="text-center">Targets</th>
            <th class="text-center">Commodity Code</th>
            <th class="text-center" style="width: 150px;">Status</th>
            <th class="text-center" style="width: 120px;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of tableData">
            <td>{{ item.name }}</td>
            <td class="text-center">
              <a routerLink="inner-grid" [queryParams]="{ id: item.commodityId }"
                style="cursor: pointer; color: blue; text-decoration: underline;">
                {{ item.targetCount }}
              </a>
            </td>
            <td class="text-center">{{ item.code }}</td>
            <td class="text-center">
              <a class="status-link" [ngClass]="item.isActive ? 'text-blue' : 'text-red'"
                [class.disable-custom]="!canUpdate" matTooltip="Click to Change Status" (click)="toggleStatus(item)"
                style="cursor: pointer;">
                {{ item.isActive ? 'Active' : 'Inactive' }}
              </a>
            </td>
            <td class="text-center manage-icons">
              <i class="fa fa-edit text-primary" [class.disable-custom]="!canUpdate" matTooltip="Edit"
                (click)="addCommodity(item)" style="cursor: pointer; margin-right: 10px;"></i>
              <i class="fa fa-trash text-danger" [class.disable-custom]="!canDelete" matTooltip="Delete"
                (click)="deleteCommodity(item)" style="cursor: pointer;"></i>
            </td>
          </tr>
          <tr *ngIf="tableData.length === 0">
            <td colspan="5" class="text-center text-muted" style="padding: 15px;">No Commodities Found</td>
          </tr>
        </tbody>
      </table>

      <mat-paginator [length]="tableData.length" [pageSize]="20" [pageSizeOptions]="[5, 10, 20, 25, 50]"
        showFirstLastButtons></mat-paginator>
    </div>
  </div>

  <div class="mt-4">
    <router-outlet></router-outlet>
  </div>
</div>
