        <label class="filter-label mb-0">Select Month :</label>
        <mat-select placeholder="Select Month" class="form-control" formControlName="month"
            style="width: auto; min-width: 120px;">
            <mat-option *ngFor="let m of months" [value]="m.value">{{ m.name }}</mat-option>
        </mat-select>

        <label class="filter-label mb-0">Select Year :</label>
        <mat-select placeholder="Select Year" class="form-control" formControlName="year"
            style="width: auto; min-width: 120px;">
            <mat-option *ngFor="let y of years" [value]="y">{{ y }}</mat-option>
        </mat-select>
    </div>

    <button class="go-btn" mat-raised-button (click)="onGoClick()">
        <mat-icon class="mat-icon mt-1">search</mat-icon> Go
    </button>

    <button mat-raised-button class="btn-clear" (click)="onClearFilter()">
        <mat-icon>settings_backup_restore</mat-icon> Clear
    </button>
</div>

<div class="dashboard-container">
    <div class="chart-wrapper">
        <highcharts-chart [Highcharts]="Highcharts" [options]="chartOptions"
            style="width:100%;height:500px;display:block;">
        </highcharts-chart>
    </div>
</div>
