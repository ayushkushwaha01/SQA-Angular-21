<div class="actions-container">


  <div class="filter-bar" [formGroup]="filterForm">
    <div class="filter-group right-align-group">

      <label class="filter-label mb-0">Commodity :</label>
      <mat-select class="form-control" placeholder="Select Commodity" formControlName="commodityId"
        style="width: auto; min-width: 180px;">

        <mat-option *ngFor="let item of originalTableData" [value]="item.commodityId">

          {{ item.name }}

        </mat-option>

      </mat-select>



      <label class="filter-label mb-0">Select Year :</label>
      <!-- <mat-select placeholder="Select Year" class="form-control" formControlName="Year"
        style="width: auto; min-width: 120px;">

        <mat-option value="2023">2023</mat-option>
        <mat-option value="2024">2024</mat-option>
        <mat-option value="2025">2025</mat-option>
        <mat-option value="2025">2026</mat-option>
      </mat-select> -->

      <mat-select placeholder="Select Year" class="form-control" formControlName="Year"
        style="width: auto; min-width: 120px;">
        <mat-option *ngFor="let y of years" [value]="y">{{ y }}</mat-option>
      </mat-select>
    </div>

    <button class="go-btn" mat-raised-button (click)="getCapaAgingPercentage(); getanalaytics();">
      <mat-icon class="mat-icon mt-1">search</mat-icon> Go
    </button>
    <button mat-raised-button class="btn-clear" (click)="onClearFilter()">
      <mat-icon>settings_backup_restore</mat-icon> Clear
    </button>
  </div>

  <!-- Monthly Critical Actions Logged -->
  <h2 class="section-title">Monthly Critical CAPA Logged</h2>
  <div class="full-chart-card">
    <highcharts-chart [Highcharts]="Highcharts" [options]="criticalOptions"
      style="width: 100%; height: 300px; display: block">
    </highcharts-chart>
  </div>

  <!-- Monthly Important Actions Logged -->
  <h2 class="section-title">Monthly Important CAPA Logged</h2>
  <div class="full-chart-card">
    <highcharts-chart [Highcharts]="Highcharts" [options]="importantOptions"
      style="width: 100%; height: 300px; display: block">
    </highcharts-chart>
  </div>

  <!-- Monthly Critical and Important Actions Logged Versus Resolved -->
  <h2 class="section-title">
    Monthly Critical and Important CAPA Logged Versus Resolved
  </h2>
  <div class="full-chart-card">
    <highcharts-chart [Highcharts]="Highcharts" [options]="logVsResolvedOptions"
      style="width: 100%; height: 300px; display: block">
    </highcharts-chart>
  </div>

  <!-- Aging Analysis -->
  <h2 class="section-title aging-title">Agieng Analysis</h2>
  <div class="aging-row">
    <div class="aging-table-card">
      <table>
        <thead>
          <tr>
            <th>Period</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of agingList">
            <td>{{ item.period }}</td>
            <td>{{ item.action }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="aging-chart-card">
      <highcharts-chart [Highcharts]="Highcharts" [options]="agingPieOptions"
        style="width: 100%; height: 350px; display: block">
      </highcharts-chart>
    </div>
  </div>
</div>

<!-- Scroll to Top Button -->
<button mat-mini-fab color="primary" class="scroll-top-btn" (click)="scrollToTop()">
  <mat-icon>keyboard_arrow_up</mat-icon>
</button>
