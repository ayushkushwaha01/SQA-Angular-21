<div class="filter-bar">









    <div class="filter-group right-align-group" [formGroup]="filterForm">


        <label class="filter-label mb-0">Select Year :</label>
        <mat-select placeholder="Select Year" class="form-control" formControlName="Year"
            style="width:auto;min-width:120px;">

            <mat-option [value]="2023">2023</mat-option>
            <mat-option [value]="2024">2024</mat-option>
            <mat-option [value]="2025">2025</mat-option>
            <mat-option [value]="2026">2026</mat-option>

        </mat-select>
    </div>

    <button class="go-btn" mat-raised-button (click)="getBellCurve()">
        <mat-icon>search</mat-icon>
        Go
    </button>
    <button mat-raised-button class="btn-clear" (click)="onClearFilter()">
        <mat-icon>settings_backup_restore</mat-icon>
        Clear
    </button>

</div>



<div class="dashboard-container">
    <div class="chart-wrapper">
        <highcharts-chart [Highcharts]="Highcharts" [options]="chartOptions" [oneToOne]="true"
            style="width:100%;height:500px;display:block;">
        </highcharts-chart>
    </div>
</div>
