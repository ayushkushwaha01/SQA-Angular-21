<div class="dialog-header pt-2" style="height:50px">
    <h2 mat-dialog-title class="m-0 text-center text-white pb-2 pt-2 mt-2"
        style="padding-top:0px; padding-left: 20px; font-weight: 400;font-size: 18px;">List Of Documents</h2>
</div>

<div mat-dialog-content class="pt-4 overflow-hidden">
    <form class="form-horizontal" *ngIf="canCreate || canUpdate">

        <div class="row align-items-center mb-3">
            <div class="col-sm-3">
                <label class="control-label font-weight-bold mb-0">
                    Upload Doc:<span class="text-danger">*</span>
                </label>
            </div>
            <div class="col-sm-9">
                <input type="file" class="form-control" style="padding:3px" (change)="onPdfSelected($event)">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-sm-12 d-flex justify-content-end">
                <button mat-raised-button color="primary" class="save-btn" (click)="uploadDocuments()">

                    <mat-icon>save</mat-icon>
                    Save
                </button>
            </div>
        </div>

    </form>

    <div class="table-responsive mt-2">
        <table class="table table-bordered custom-table mb-0">
            <thead>
                <tr>
                    <th>Document Title</th>
                    <th class="text-center">Uploaded Date</th>
                    <th class="text-center">View</th>
                    <th class="text-center" *ngIf="canDelete">Actions</th>
                </tr>
            </thead>
            <tbody>

                <tr *ngFor="let doc of tableLists">

                    <td>{{doc.docTitlte}}</td>

                    <td class="text-center">
                        {{doc.createdDate | date:'MM/dd/yyyy'}}
                    </td>

                    <td class="text-center">

                        <a [href]="doc.docurl" target="_blank">

                            <mat-icon color="primary">
                                visibility
                            </mat-icon>

                        </a>

                    </td>

                    <td class="text-center" *ngIf="canDelete">

                        <i class="fa fa-trash" style="color:red;cursor:pointer" (click)="deleteConfirmation(doc)">
                        </i>

                    </td>

                </tr>

            </tbody>
        </table>

        <mat-paginator [length]="totalSize" [pageIndex]="currentPage" [pageSize]="pageSize"
            [pageSizeOptions]="[5,10,25,50]" (page)="fnHandlePage($event)" showFirstLastButtons>
        </mat-paginator>
    </div>
</div>

<mat-dialog-actions align="end" class="pb-2 pe-3">
    <button mat-raised-button class="close-btn" (click)="closeDialog()">
        <mat-icon
            style="font-size: 20px; height: 20px; width: 20px; margin-right: 4px; margin-top: 4px;">cancel</mat-icon>
        Close
    </button>
</mat-dialog-actions>
