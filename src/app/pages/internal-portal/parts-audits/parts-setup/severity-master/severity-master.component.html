    <div fxLayout="row wrap" *ngIf="showFilters" class="mb-3">
        <div fxFlex="100" class="flex w-100">
            <form [formGroup]="filterForm">
                <mat-card class="filter">
                    <mat-card-content>
                        <div class="row col-sm-12">

                            <div class="col-sm-3 row me-2">
                                <div class="col-sm-4 d-flex align-items-center"><b>Severity Name:</b></div>
                                <div class="col-sm-8">
                                    <input type="text" formControlName="severityName" class="form-control"
                                        placeholder="Search by Name...">
                                </div>
                            </div>

                            <div class="col-sm-3 row me-2">
                                <div class="col-sm-4 d-flex align-items-center"><b>Rating:</b></div>
                                <div class="col-sm-8">
                                    <input type="text" formControlName="rating" class="form-control"
                                        placeholder="Search by Rating...">
                                </div>
                            </div>

                            <div class="col-sm-3 row me-2">
                                <div class="col-sm-3 d-flex align-items-center"><b>Status:</b></div>
                                <div class="col-sm-8">
                                    <mat-select formControlName="status" placeholder="Select Status"
                                        class="form-control">
                                        <mat-option *ngFor="let option of Status" [value]="option.value">
                                            {{option.name}}
                                        </mat-option>
                                    </mat-select>
                                </div>
                            </div>

                            <div class="col-sm-3">
                                <button mat-raised-button color="primary" class="pull-right" (click)="applyFilter()">
                                    <mat-icon>search</mat-icon> Search
                                </button>
                                <button mat-raised-button class="pull-right btn-default margin-right-10"
                                    (click)="clearFilter()">
                                    <mat-icon>settings_backup_restore</mat-icon> Clear
                                </button>
                            </div>

                        </div>
                    </mat-card-content>
                </mat-card>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover" style="width: 100%;">
            <thead class="tbl-head">
                <tr>
                    <th class="text-center" style="width: 100px;">Rating</th>
                    <th class="text-left">Severity Name</th>

                    <th class="text-center" style="width: 120px;">Actions</th>
                </tr>
            </thead>

            <tbody>

                <tr *ngFor="let item of filteredSeverities">
                    <!-- Rating - Read Only -->
                    <td class="text-center">
                        {{ item.rating }}
                    </td>

                    <!-- Severity Name - Editable -->
                    <td>
                        <input type="text" class="form-control" [(ngModel)]="item.severityName"
                            placeholder="Enter Severity Name">
                    </td>



                    <!-- Save -->
                    <td class="text-center">

                        <button mat-raised-button color="primary" [ngClass]="{ 'disable-custom': !canUpdate }"
                            [matTooltip]="!canUpdate ? 'You don’t have permission to update' : 'Save'"
                            (click)="canUpdate && saveSeverity(item)">

                            <mat-icon class="mt-1">
                                save
                            </mat-icon>

                            <span class="button-text">
                                Save
                            </span>

                        </button>

                    </td>

                </tr>

                <tr *ngIf="!filteredSeverities || filteredSeverities.length === 0">
                    <td colspan="3" class="text-center">
                        No records found
                    </td>
                </tr>

            </tbody>
        </table>
    </div>
</div>
