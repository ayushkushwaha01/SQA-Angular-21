<div *ngIf="!canRead" class="container text-center" style="margin-top: 80px;">
  <div class="card p-5 shadow-sm border-danger" style="max-width: 500px; margin: 0 auto; background-color: #fff5f5;">
    <h3 class="text-danger font-weight-bold">Access Denied</h3>
    <p class="text-muted">You do not have permission to view this page.</p>
    <p class="text-secondary small">Please contact your administrator if you believe this is an error.</p>
  </div>
</div>

<div fxLayout="row wrap" #resizedDiv *ngIf="canRead">

  <!-- <div class="col-sm-12 flex-p w-100" style="display: flex; justify-content: flex-end; padding-right: 20px; margin-top: 10px;">
    <button mat-raised-button color="warn" (click)="runEscalationsNow()" [disabled]="isRunningEscalations">
      <mat-icon>{{ isRunningEscalations ? 'hourglass_empty' : 'bolt' }}</mat-icon>
      {{ isRunningEscalations ? 'Scanning Database...' : 'Run Escalation Scan Now' }}
    </button>
  </div> -->

  <div class="col-sm-12 flex-p w-100">

    <div class="table-responsive sizeAlign">

      <table id="example2" style="margin-top: 10px; width: 99%; margin-left: 14px;"
        class="table table-bordered table-hover">

        <thead class="tbl-head">
          <tr class="tr-grid-header">
            <th>Escalation</th>
            <th>Description</th>
            <th>Current Value</th>
            <th>Revised Value</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let item of values">

            <!-- Escalation -->
            <td>
              {{ item.escalationName }}
            </td>

            <!-- Description -->
            <td>
              {{ item.description }}
            </td>

            <!-- Current Value -->
            <td>
              {{ item.previousValue }}
            </td>

            <!-- Revised Value -->
            <td>

              <input type="text" class="form-control" [(ngModel)]="item.newValue" placeholder="Enter Revised Value">

            </td>

            <!-- Actions -->
            <td>

              <div style="display: flex; justify-content: center;">

                <button mat-raised-button color="primary" [ngClass]="{'disable-custom': !canUpdate}"
                  [matTooltip]="!canUpdate ? 'You don’t have permission to update' : 'Click to Save'"
                  (click)="canUpdate && saveEscalation(item)">

                  <mat-icon style="font-size: 20px;" class="mt-1">
                    save
                  </mat-icon>

                  <span class="button-text" style="margin-left: 5px;">
                    Save
                  </span>

                </button>

              </div>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
