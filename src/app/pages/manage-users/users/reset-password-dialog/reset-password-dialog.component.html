<div class="NewHeader">
    <h1 mat-dialog-title>
        {{ dialogTitle }}
    </h1>
</div>

<div mat-dialog-content style="padding: 20px;">
    <form class="form-horizontal" [formGroup]="myform">

        <!-- Current Password (shown when self changing password) -->
        <div class="row align-items-center mb-3 mt-2" *ngIf="isSelfChange">
            <label class="col-sm-4 control-label text-end fw-bold">Current Password: <span
                    class="text-danger">*</span></label>
            <div class="col-sm-8">
                <input type="password" formControlName="OldPassword" class="form-control" maxlength="50"
                    placeholder="Please Enter Current Password" style="background-color: #fefec4 !important;">
                <small class="text-danger"
                    *ngIf="myform.controls['OldPassword'].invalid && (myform.controls['OldPassword'].dirty || myform.controls['OldPassword'].touched)">
                    Current password is required.
                </small>
            </div>
        </div>

        <!-- New Password -->
        <div class="row align-items-center mb-3" [class.mt-2]="!isSelfChange">
            <label class="col-sm-4 control-label text-end fw-bold">New Password: <span
                    class="text-danger">*</span></label>
            <div class="col-sm-8">
                <input type="password" formControlName="Password" class="form-control" maxlength="50"
                    placeholder="Please Enter New Password" style="background-color: #fefec4 !important;">
                <small class="text-danger"
                    *ngIf="myform.controls['Password'].invalid && (myform.controls['Password'].dirty || myform.controls['Password'].touched)">
                    New password is required.
                </small>
            </div>
        </div>

        <!-- Confirm Password -->
        <div class="row align-items-center mb-3">
            <label class="col-sm-4 control-label text-end fw-bold">Confirm Password: <span
                    class="text-danger">*</span></label>
            <div class="col-sm-8">
                <input type="password" formControlName="UserPassword" class="form-control" maxlength="50"
                    placeholder="Please Confirm New Password" style="background-color: #fefec4 !important;">
                <small class="text-danger"
                    *ngIf="myform.controls['UserPassword'].invalid && (myform.controls['UserPassword'].dirty || myform.controls['UserPassword'].touched)">
                    Confirm password is required.
                </small>
            </div>
        </div>

    </form>
</div>

<mat-dialog-actions align="end" style="padding-bottom: 20px; padding-right: 1px;">
    <button mat-raised-button color="primary" [disabled]="!myform.valid || isSubmitting" (click)="saveData()">
        <mat-icon>save</mat-icon> Save
    </button>
    <button mat-raised-button style="background-color: lightgray; color: red; margin-left: 10px;" (click)="close()">
        <mat-icon>cancel</mat-icon> Close
    </button>
</mat-dialog-actions>
