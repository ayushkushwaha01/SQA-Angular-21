<div class="delete-dialog-container">
  <!-- Red Header -->
  <div class="delete-dialog-header">
    <h3 class="dialog-title">{{ data?.title || 'Delete Record' }}</h3>
  </div>

  <!-- Content -->
  <div class="delete-dialog-body">
    <p class="dialog-message">{{ data?.content || 'Are you sure you want to delete this record?' }}</p>
  </div>

  <!-- Actions -->
  <div class="delete-dialog-actions">
    <button mat-raised-button type="button" class="btn-delete" (click)="delete()">
      Delete
    </button>
    <button type="button" mat-raised-button class="add-dark-hover btn-default" (click)="close()" style="cursor: pointer;">
      <span>&nbsp;Close</span>
    </button>
  </div>
</div>
